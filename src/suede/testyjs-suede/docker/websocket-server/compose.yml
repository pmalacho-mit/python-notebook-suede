services:
  yjs-websocket-server:
    build:
      context: .
      dockerfile: Dockerfile
    # The default bridge, rather than a network of this project's own: tools
    # that locate the devcontainer by "the network it hosts" cannot choose
    # between several, and a sync server for tests is rarely the only one.
    network_mode: bridge
    ports:
      - "1234:1234"
